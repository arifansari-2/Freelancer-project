<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf" content="{{ csrf_token() }}">
<title>{% block title %}FreelanceHub{% endblock %}</title>
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-auth="{{ 1 if session.get('uid') else 0 }}">
<nav>
  <a class="brand" href="/"><span class="logo">⚡</span>FreelanceHub</a>
  <div class="navr">
    {% if session.get('uid') %}
      <span class="hello">Hi, {{ session.name }}</span>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('notifications') }}" title="Notifications">🔔<span id="bell-count" class="bell" hidden>0</span></a>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="linkbtn">Logout</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a><a class="btn sm" href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </div>
</nav>
<div class="container">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<div id="toasts"></div>
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="m-title"></h3><p id="m-text" class="muted"></p>
    <textarea id="m-reason" placeholder="Reason (optional), the freelancer will see this" maxlength="200" hidden></textarea>
    <div class="modal-actions"><button type="button" class="btn ghost" id="m-cancel">Cancel</button><button type="button" class="btn" id="m-ok">Confirm</button></div>
  </div>
</div>
<script src="{{ url_for('static', filename='live.js') }}"></script>
</body>
</html>
