{% extends "base.html" %}{% block content %}
<div class="center card reveal"><h2>Create your account</h2>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input name="name" placeholder="Full name" required>
<input name="email" type="email" placeholder="Email" required>
<input name="password" type="password" minlength="6" placeholder="Password (min 6 chars)" required>
<select name="role"><option>Freelancer</option><option>Client</option></select>
<input name="skills" placeholder="Skills, comma separated (freelancers)">
<textarea name="bio" placeholder="Short bio (freelancers)"></textarea>
<button class="btn" style="width:100%;justify-content:center">Register</button></form></div>{% endblock %}
